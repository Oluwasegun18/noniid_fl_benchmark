# Paper-informed exhaustive search configuration.
# Shared training parameters are searched consistently across algorithms.
# Algorithm-specific parameters are added only where supported by the corresponding method.
# Convergence is based on a smoothed validation-accuracy plateau; raw validation accuracy still selects the saved best model.

output_dir: search_outputs
algorithms:
- fedavg
- fedprox
- scaffold
- fednova
- feddyn
- moon
- fedsam
- fedgucci
search:
  method: grid
  exhaustive: true
seeds:
  search_sampler_seed: 2026
shared_search_space:
  training.learning_rate:
    type: grid
    values:
    - 0.01
    - 0.05
    - 0.1
  training.local_epochs:
    type: grid
    values:
    - 1
    - 3
    - 5
    - 10
  training.batch_size:
    type: grid
    values:
    - 32
    - 64
    - 128
algorithm_search_spaces:
  fedavg: {}
  fedprox:
    algorithm.parameters.fedprox_mu:
      type: grid
      values:
      - 0.001
      - 0.01
      - 0.1
      - 1.0
  scaffold: {}
  fednova: {}
  feddyn:
    algorithm.parameters.feddyn_alpha:
      type: grid
      values:
      - 0.001
      - 0.01
      - 0.1
  moon:
    algorithm.parameters.moon_mu:
      type: grid
      values:
      - 0.1
      - 1.0
      - 5.0
      - 10.0
  fedsam:
    algorithm.parameters.fedsam_rho:
      type: grid
      values:
      - 0.1
      - 0.5
      - 1.0
  fedgucci:
    algorithm.parameters.fedgucci_beta:
      type: grid
      values:
      - 0.025
      - 0.1
      - 0.4
      - 1.6
    algorithm.parameters.fedgucci_num_anchors:
      type: grid
      values:
      - 1
      - 3
      - 5
      - 9
termination:
  mode: convergence
  monitor: val_accuracy
  min_delta: 0.001
  patience_evaluations: 10
  min_rounds: 50
  evaluation_frequency: 1
  max_search_rounds: 500
  max_confirmation_rounds: 500
  smoothing_window: 3
budget:
  search_seeds:
  - 42
  confirmation_seeds:
  - 11
  - 22
  - 33
  - 44
  - 55
  max_total_runs_per_algorithm: null
  max_wall_time_hours_per_algorithm: null
selection:
  metric: val_accuracy
  mode: maximize
  tie_breakers:
  - mean_local_loss
  - cumulative_wall_time_sec
  - total_comm_bytes
  constraints: {}

# Optuna is used as a resumable search coordinator. GridSampler preserves the
# exhaustive predefined parameter space used by the methodology.
optuna:
  sampler: grid
  storage:
    # Journal storage requires no database service and supports resumed workers.
    # For multi-node production use, OPTUNA_STORAGE_URL may override this with
    # a PostgreSQL/MySQL RDB URL supplied by the cluster environment.
    backend: journal
  search_energy_role: descriptive
  confirmation_energy_role: ranking
