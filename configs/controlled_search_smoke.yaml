scenario_name: cifar10_dirichlet_a0p5_smoke
output_dir: search_outputs
algorithms:
- fedavg
- fedprox
- scaffold
- fedgucci
seeds:
  search_sampler_seed: 2026
shared_search_space:
  training.learning_rate:
    type: categorical
    values:
    - 0.005
    - 0.01
  training.local_epochs:
    type: categorical
    values:
    - 1
    - 2
  training.batch_size:
    type: categorical
    values:
    - 32
    - 64
algorithm_search_spaces:
  fedavg: {}
  fedprox:
    algorithm.parameters.fedprox_mu:
      type: categorical
      values:
      - 0.001
      - 0.01
      - 0.1
  scaffold:
    algorithm.parameters.scaffold_server_lr:
      type: categorical
      values:
      - 0.5
      - 1.0
  fedgucci:
    algorithm.parameters.fedgucci_beta:
      type: categorical
      values:
      - 0.01
      - 0.1
    algorithm.parameters.fedgucci_num_anchors:
      type: categorical
      values:
      - 1
      - 3
budget:
  search_method: random
  max_configurations_per_algorithm: 4
  search_seeds:
  - 1
  confirmation_seeds:
  - 11
  - 22
  - 33
  rounds_per_search_run: 3
  rounds_per_confirmation_run: 5
  max_total_runs_per_algorithm: 4
  max_wall_time_hours_per_algorithm: 2
selection:
  metric: val_accuracy
  mode: maximize
  tie_breakers:
  - mean_local_loss
  - cumulative_wall_time_sec
  - total_comm_bytes
  constraints: {}
